<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="#154734"/>

  <!-- Gold accent ring -->
  <circle cx="50" cy="50" r="45.5" fill="none" stroke="#FFB81C" stroke-width="1.2" stroke-opacity="0.4"/>

  <!-- Open book — left page -->
  <path d="M50 28 C50 28 34 29 27 35 L27 57 C34 52 50 53 50 53 Z" fill="#FFB81C" opacity="0.92"/>

  <!-- Open book — right page -->
  <path d="M50 28 C50 28 66 29 73 35 L73 57 C66 52 50 53 50 53 Z" fill="#FFB81C" opacity="0.6"/>

  <!-- Spine shadow -->
  <rect x="49" y="27" width="2" height="27" rx="1" fill="#154734" opacity="0.55"/>

  <!-- Horizontal line on pages -->
  <line x1="30" y1="40" x2="48" y2="40" stroke="#154734" stroke-width="1" stroke-opacity="0.25"/>
  <line x1="30" y1="44" x2="48" y2="44" stroke="#154734" stroke-width="1" stroke-opacity="0.18"/>
  <line x1="30" y1="48" x2="48" y2="48" stroke="#154734" stroke-width="1" stroke-opacity="0.12"/>
  <line x1="52" y1="40" x2="70" y2="40" stroke="#154734" stroke-width="1" stroke-opacity="0.18"/>
  <line x1="52" y1="44" x2="70" y2="44" stroke="#154734" stroke-width="1" stroke-opacity="0.12"/>
  <line x1="52" y1="48" x2="70" y2="48" stroke="#154734" stroke-width="1" stroke-opacity="0.08"/>

  <!-- ATL initials -->
  <text x="50" y="74" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-weight="900" font-size="15"
        fill="#ffffff" letter-spacing="3">ATL</text>

  <!-- Subtitle lines -->
  <text x="50" y="85" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-weight="600" font-size="5.6"
        fill="#FFB81C" letter-spacing="0.6">ACADEMY FOR TEACHING</text>

  <text x="50" y="94" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-weight="600" font-size="5.6"
        fill="#FFB81C" letter-spacing="0.6">&amp; LEARNING</text>
</svg>
