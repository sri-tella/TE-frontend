[build]
  command   = "npm install && npm run build"
  publish   = "dist"

[build.environment]
  NODE_VERSION = "20"
  SECRETS_SCAN_OMIT_KEYS = "VITE_API_BASE_URL"

[functions]
  node_bundler = "esbuild"

# index.html — never cache so browsers always get the latest deploy
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma        = "no-cache"

# Hashed static assets — safe to cache long-term (Vite includes hash in filename)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# SPA routing — redirect all paths to index.html
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
