<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <circle cx="50" cy="50" r="50" fill="#1a2535"/>

  <!-- Magnifying glass: lens fill -->
  <circle cx="42" cy="42" r="22" fill="#2dd4bf" fill-opacity="0.07"/>
  <!-- Lens outer ring -->
  <circle cx="42" cy="42" r="22" fill="none" stroke="#2dd4bf" stroke-width="4.5"/>
  <!-- Inner lens detail ring -->
  <circle cx="42" cy="42" r="13" fill="none" stroke="#2dd4bf" stroke-width="1.5" stroke-opacity="0.3"/>

  <!-- Glass shine -->
  <path d="M 27 34 Q 31 24 40 25" stroke="rgba(255,255,255,0.4)" stroke-width="2.2" fill="none" stroke-linecap="round"/>

  <!-- Handle -->
  <line x1="57.5" y1="57.5" x2="74" y2="74" stroke="#2dd4bf" stroke-width="6.5" stroke-linecap="round"/>
</svg>
